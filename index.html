<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>추억의 나이트 · 메타버스</title>
<style>
:root{--pink:#ff3d9a;--cyan:#3de6ff;--bg:#0b0618;--panel:rgba(18,8,40,.86);--line:rgba(255,61,154,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.neon{text-shadow:0 0 6px var(--pink),0 0 18px var(--pink)}
#topbar{position:fixed;left:12px;top:10px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
#title{font-weight:800;letter-spacing:1px;font-size:18px;color:#ffd1ea}
#badge{display:inline-block;margin-left:8px;font-size:11px;padding:2px 8px;border:1px solid var(--cyan);color:var(--cyan);border-radius:10px;vertical-align:middle}
#topbtns{display:flex;gap:8px;pointer-events:auto}
.ibtn{background:var(--panel);border:1px solid var(--line);color:#fff;border-radius:10px;min-width:42px;height:42px;font-size:18px;cursor:pointer;padding:0 10px}
.ibtn:active{transform:scale(.96)}
#help{position:fixed;left:12px;top:46px;font-size:12px;color:#cdb7ff;opacity:.85;pointer-events:none;line-height:1.6;z-index:5}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:9}
.toast{background:var(--panel);border:1px solid var(--cyan);padding:8px 14px;border-radius:12px;font-size:14px;animation:fade 3.6s forwards;max-width:90vw}
@keyframes fade{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#act{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:linear-gradient(135deg,#ff3d9a,#7b3dff);border:0;color:#fff;font-weight:700;font-size:16px;padding:12px 20px;border-radius:26px;box-shadow:0 0 18px rgba(255,61,154,.7);cursor:pointer;display:none;z-index:6;max-width:92vw}
#dlg{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(680px,96vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:none;z-index:8;box-shadow:0 0 30px rgba(123,61,255,.5)}
#dlg .who{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:700}
#dlg .tag{font-size:12px;font-weight:400;color:var(--cyan);border:1px solid var(--cyan);border-radius:10px;padding:1px 8px}
#dlg .say{min-height:44px;line-height:1.55;font-size:15px;margin:6px 0 10px;color:#fff}
#dlg .meter{height:8px;background:#2a1850;border-radius:6px;overflow:hidden;margin:2px 0 10px;display:none}
#dlg .meter i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#ff3d9a,#ffd23d);transition:width .4s}
#dlg .opts{display:flex;flex-direction:column;gap:7px}
#dlg button.opt{background:#241048;border:1px solid #5b3aa8;color:#fff;border-radius:10px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer}
#dlg button.opt:hover,#dlg button.opt:focus{border-color:var(--pink);background:#33145f}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:7}
#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#3b0a5e 0%,#0b0618 70%)}
#start .card{width:min(420px,92vw);text-align:center;padding:26px 22px;border:1px solid var(--line);border-radius:20px;background:rgba(14,6,34,.8);box-shadow:0 0 40px rgba(255,61,154,.35)}
#start h1{margin:0 0 4px;font-size:30px;color:#ffd1ea}
#start p{margin:4px 0 14px;color:#cdb7ff;font-size:13px}
#start input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid #5b3aa8;background:#1b0d3a;color:#fff;font-size:16px;text-align:center}
.swatches{display:flex;gap:8px;justify-content:center;margin:12px 0}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:#fff;box-shadow:0 0 12px #fff}
#go{width:100%;margin-top:6px;padding:14px;border:0;border-radius:12px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff3d9a,#7b3dff);cursor:pointer}
#go:disabled{opacity:.5}
#err{color:#ff8fb8;font-size:13px;min-height:18px;margin-top:8px}
#joy{position:fixed;left:22px;bottom:26px;width:120px;height:120px;border-radius:50%;border:2px solid var(--line);background:rgba(255,255,255,.05);display:none;z-index:6}
#joy i{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,61,154,.6)}
#chat{position:fixed;left:12px;bottom:12px;width:min(360px,60vw);display:none;z-index:6}
#chatlog{max-height:150px;overflow:auto;font-size:13px;line-height:1.45;background:rgba(10,4,26,.6);border-radius:10px;padding:6px 8px;margin-bottom:6px}
#chatlog .sys{color:#7be7ff}#chatlog .tbl{color:#ffd23d}#chatlog b{color:#ff9fd0}
#chatrow{display:flex;gap:6px}
#chatrow input{flex:1;padding:9px;border-radius:10px;border:1px solid #5b3aa8;background:#1b0d3a;color:#fff;font-size:14px;min-width:0}
#chatrow button{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:10px;padding:0 10px;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:30}
.modal .box{width:min(400px,92vw);background:#150a30;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 0 30px rgba(255,61,154,.35)}
.modal h3{margin:0 0 8px}.modal .row{display:flex;gap:8px;margin-top:12px}
.modal button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#241048;color:#fff;font-size:14px;cursor:pointer}
.modal button.pri{background:linear-gradient(135deg,#ff3d9a,#7b3dff);border:0;font-weight:700}
.modal select,.modal input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid #5b3aa8;background:#1b0d3a;color:#fff;font-size:15px}
@media (max-width:640px){#help{display:none}#title{font-size:15px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="topbar">
  <div id="title" class="neon">🪩 추억의 나이트 <span id="badge">DEMO</span></div>
  <div id="topbtns"><button class="ibtn" id="btnMusic" title="음악">🔊</button><button class="ibtn" id="btnHelp" title="도움말">❓</button></div>
</div>
<div id="help">이동 <b>WASD/방향키</b> · 바닥 클릭 이동 · 드래그로 시점 회전 · 휠 줌 · <b>E</b> 상호작용</div>
<div id="toast"></div>
<button id="act"></button>
<div id="dlg"></div>
<div id="fade"></div>
<div id="joy"><i></i></div>
<div id="chat"><div id="chatlog"></div><div id="chatrow"><input id="chatin" maxlength="120" placeholder="메시지 입력 후 Enter"><button id="chatscope">전체</button></div></div>

<div id="start"><div class="card">
  <h1 class="neon">🪩 추억의 나이트</h1>
  <p>그 시절 그 조명 아래, 부킹 한 번 해볼까요?<br>(메타버스 · 3D 웹)</p>
  <input type="text" id="nick" maxlength="10" placeholder="닉네임 (2~10자)" value="">
  <div class="swatches" id="sws"></div>
  <button id="go">입장하기</button>
  <div id="err"></div>
  <p style="font-size:11px;margin-top:10px">이 서비스는 가상공간 오락 콘텐츠이며, 만 19세 이상 이용을 전제로 합니다.</p>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
if (typeof THREE === 'undefined') { $('#err').textContent = '3D 라이브러리(three.js)를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'; $('#go').disabled = true; return; }
const T = THREE;

/* ───────── 공용 API (multi.js / ops.js 가 사용) ───────── */
const NC = window.NC = {
  THREE: T, mode: 'demo', chatEnabled: false,
  settings: { name: '', color: 0xff3d9a },
  hooks: { beforeStart: [] }, interactProviders: [], tickers: [],
  remotes: new Map(), ui: {}, net: null, session: null, listeners: {},
  on(ev, fn) { (this.listeners[ev] = this.listeners[ev] || []).push(fn); },
  emit(ev, ...a) { (this.listeners[ev] || []).forEach(f => { try { f(...a); } catch (e) { console.error(e); } }); },
};

/* ───────── 렌더러 / 씬 ───────── */
const canvas = $('#c');
const renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new T.Scene();
scene.background = new T.Color(0x07030f);
scene.fog = new T.FogExp2(0x0a0418, 0.018);
const camera = new T.PerspectiveCamera(55, 1, 0.1, 120);
NC.scene = scene; NC.camera = camera; NC.renderer = renderer;
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const ROOM = { x: 20, z: 16 };
const std = (c, o = {}) => new T.MeshStandardMaterial(Object.assign({ color: c, roughness: .7, metalness: .1 }, o));
const emi = (c, i = 1) => new T.MeshStandardMaterial({ color: 0x000000, emissive: c, emissiveIntensity: i });

scene.add(new T.AmbientLight(0x4a3a7a, .55));
scene.add(new T.HemisphereLight(0x9a6bff, 0x180a2a, .35));

/* ───────── 바닥 / 벽 / 천장 ───────── */
const floor = new T.Mesh(new T.PlaneGeometry(ROOM.x * 2, ROOM.z * 2), std(0x120a22, { roughness: .35, metalness: .4 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const ceil = new T.Mesh(new T.PlaneGeometry(ROOM.x * 2, ROOM.z * 2), std(0x0a0614));
ceil.rotation.x = Math.PI / 2; ceil.position.y = 9; scene.add(ceil);
const wallMat = std(0x1c0f3a, { roughness: .9 });
[[0, -ROOM.z, 0], [0, ROOM.z, Math.PI], [-ROOM.x, 0, Math.PI / 2], [ROOM.x, 0, -Math.PI / 2]].forEach(([x, z, r]) => {
  const w = new T.Mesh(new T.PlaneGeometry(x === 0 ? ROOM.x * 2 : ROOM.z * 2, 9), wallMat);
  w.position.set(x, 4.5, z); w.rotation.y = r; scene.add(w);
});
// 벽 네온 띠
[[0, -ROOM.z + .05, ROOM.x * 2, 0], [-ROOM.x + .05, 0, ROOM.z * 2, Math.PI / 2], [ROOM.x - .05, 0, ROOM.z * 2, Math.PI / 2], [0, ROOM.z - .05, ROOM.x * 2, 0]].forEach(([x, z, len, r], i) => {
  [0.4, 8.4].forEach(y => { const m = new T.Mesh(new T.BoxGeometry(len, .1, .1), emi(i % 2 ? 0x3de6ff : 0xff3d9a, 1.2)); m.position.set(x, y, z); m.rotation.y = r; scene.add(m); });
});

/* ───────── 댄스플로어 (색이 바뀌는 타일) ───────── */
const TILE = 1.25, TN = 10, tiles = [];
const tileGeo = new T.BoxGeometry(TILE - .08, .12, TILE - .08);
for (let i = 0; i < TN; i++) for (let j = 0; j < TN; j++) {
  const m = new T.Mesh(tileGeo, new T.MeshStandardMaterial({ color: 0x120a22, emissive: 0xff3d9a, emissiveIntensity: .6, roughness: .3 }));
  m.position.set((i - TN / 2 + .5) * TILE, .06, (j - TN / 2 + .5) * TILE + 2); m.userData = { i, j }; scene.add(m); tiles.push(m);
}
const DANCE = { x0: -TN * TILE / 2, x1: TN * TILE / 2, z0: 2 - TN * TILE / 2, z1: 2 + TN * TILE / 2 };

/* ───────── 미러볼 + 조명 ───────── */
const ball = new T.Mesh(new T.IcosahedronGeometry(1.1, 2), new T.MeshStandardMaterial({ color: 0xdddddd, metalness: 1, roughness: .12, flatShading: true, emissive: 0x222244, emissiveIntensity: .6 }));
ball.position.set(0, 7.4, 2); scene.add(ball);
const wire = new T.Mesh(new T.CylinderGeometry(.03, .03, 2, 6), std(0x666666)); wire.position.set(0, 8.4, 2); scene.add(wire);
const spots = [];
[[-9, 8.6, -7, 0xff3d9a], [9, 8.6, -7, 0x3de6ff], [-9, 8.6, 11, 0xffd23d], [9, 8.6, 11, 0x9b5cff]].forEach(([x, y, z, c], k) => {
  const L = new T.SpotLight(c, 1.8, 45, .32, .6, 1.2); L.position.set(x, y, z); const tg = new T.Object3D(); scene.add(L, tg); L.target = tg;
  const geo = new T.CylinderGeometry(.05, 1.7, 11, 18, 1, true); geo.translate(0, -5.5, 0); geo.rotateX(-Math.PI / 2);
  const beam = new T.Mesh(geo, new T.MeshBasicMaterial({ color: c, transparent: true, opacity: .1, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide }));
  beam.position.copy(L.position); scene.add(beam); spots.push({ L, tg, beam, k });
});
const floorGlow = [new T.PointLight(0xff3d9a, 1.2, 18), new T.PointLight(0x3de6ff, 1.2, 18)];
floorGlow[0].position.set(-4, 1.2, 2); floorGlow[1].position.set(4, 1.2, 2); scene.add(...floorGlow);

/* ───────── 텍스트 캔버스 도우미 ───────── */
function textTex(txt, w, h, font, color, glow, bg) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
  g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (glow) { g.shadowColor = glow; g.shadowBlur = 24; }
  g.fillStyle = color; for (let i = 0; i < 2; i++) g.fillText(txt, w / 2, h / 2);
  const t = new T.CanvasTexture(c); t.anisotropy = 4; return t;
}
const sign1 = new T.Mesh(new T.PlaneGeometry(14, 3.2), new T.MeshBasicMaterial({ map: textTex('추억의 나이트', 1024, 232, '800 140px "Malgun Gothic",sans-serif', '#ffd1ea', '#ff3d9a'), transparent: true }));
sign1.position.set(0, 6.4, -ROOM.z + .1); scene.add(sign1);
const sign2 = new T.Mesh(new T.PlaneGeometry(8, 1.2), new T.MeshBasicMaterial({ map: textTex('★ NIGHT FEVER 1998 ★', 1024, 160, '800 90px Arial,sans-serif', '#aef4ff', '#3de6ff'), transparent: true }));
sign2.position.set(0, 4.5, -ROOM.z + .1); scene.add(sign2);

/* ───────── DJ 부스 / 바 ───────── */
const OBST_RECTS = [], OBST_CIRCLES = [];
(function djBooth() {
  const g = new T.Group();
  const desk = new T.Mesh(new T.BoxGeometry(8, 1.2, 1.6), std(0x20123e)); desk.position.set(0, .6, -12.2); g.add(desk);
  const screen = new T.Mesh(new T.PlaneGeometry(7.2, 2.2), new T.MeshBasicMaterial({ map: textTex('DJ NOSTALGIA  ♪', 1024, 300, '800 120px Arial,sans-serif', '#ffffff', '#ff3d9a', '#1a0836') }));
  screen.position.set(0, 2.6, -13.4); g.add(screen);
  [-5.4, 5.4].forEach(x => { const sp = new T.Mesh(new T.BoxGeometry(1.6, 3.4, 1.4), std(0x0d0820)); sp.position.set(x, 1.7, -13); g.add(sp);
    [1.2, 2.4].forEach(y => { const cone = new T.Mesh(new T.CircleGeometry(.5, 20), emi(0x7b3dff, .8)); cone.position.set(x, y, -12.28); g.add(cone); }); });
  scene.add(g); OBST_RECTS.push([-7, -15.5, 7, -11.2]);
  const dj = makeAvatar(0x3de6ff, 'DJ 노스탤지어', { hair: 0xeeeeee }); dj.position.set(0, 0, -13.1); dj.userData.dancing = true; scene.add(dj); NC.dj = dj;
})();
(function bar() {
  const g = new T.Group();
  const counter = new T.Mesh(new T.BoxGeometry(1.4, 1.3, 20), std(0x2a1450, { roughness: .4 })); counter.position.set(18.6, .65, -2); g.add(counter);
  const top = new T.Mesh(new T.BoxGeometry(1.8, .12, 20.4), emi(0xff3d9a, .5)); top.position.set(18.5, 1.32, -2); g.add(top);
  const shelf = new T.Mesh(new T.BoxGeometry(.4, 3, 20), std(0x180c30)); shelf.position.set(19.8, 1.6, -2); g.add(shelf);
  for (let i = 0; i < 12; i++) { const b = new T.Mesh(new T.CylinderGeometry(.1, .13, .6, 8), emi([0xff3d9a, 0x3de6ff, 0xffd23d, 0x6dff8a][i % 4], .9)); b.position.set(19.4, 2.5 + (i % 2) * .2, -10.5 + i * 1.7); g.add(b); }
  const lbl = new T.Mesh(new T.PlaneGeometry(4, 1), new T.MeshBasicMaterial({ map: textTex('BAR · 양주 · 맥주 · 안주', 512, 128, '700 54px "Malgun Gothic",sans-serif', '#ffe9a6', '#ffb800'), transparent: true }));
  lbl.position.set(19.55, 4.4, -2); lbl.rotation.y = -Math.PI / 2; g.add(lbl);
  scene.add(g); OBST_RECTS.push([17.4, -12.2, 20, 8.2]);
  const bt = makeAvatar(0xffffff, '바텐더', { hair: 0x222222, pants: 0x111111 }); bt.position.set(19, 0, -2); bt.rotation.y = -Math.PI / 2; scene.add(bt);
})();

/* ───────── 테이블 (6개 · 좌석 4) ───────── */
const TABLES = [[-15, -9], [-15, -1], [-15, 7], [13, -9], [13, -1], [13, 7]].map(([x, z], i) => ({ id: i, x, z }));
const SEAT_R = 1.9;
NC.tables = TABLES;
NC.tableOcc = TABLES.map(() => [null, null, null, null]);
NC.seatPos = (t, s) => { const b = TABLES[t], a = s * Math.PI / 2 + Math.PI / 4; const x = b.x + Math.cos(a) * SEAT_R, z = b.z + Math.sin(a) * SEAT_R; return { x, z, ry: Math.atan2(b.x - x, b.z - z) }; };
NC.standPos = (t, s) => { const b = TABLES[t], a = s * Math.PI / 2 + Math.PI / 4; return { x: b.x + Math.cos(a) * 3.0, z: b.z + Math.sin(a) * 3.0 }; };
TABLES.forEach(tb => {
  const top = new T.Mesh(new T.CylinderGeometry(1.15, 1.15, .1, 24), std(0x2b1856, { roughness: .3, metalness: .5 })); top.position.set(tb.x, .85, tb.z); scene.add(top);
  const stem = new T.Mesh(new T.CylinderGeometry(.12, .3, .85, 12), std(0x111111)); stem.position.set(tb.x, .42, tb.z); scene.add(stem);
  const candle = new T.Mesh(new T.SphereGeometry(.1, 10, 8), emi(0xffc36b, 2)); candle.position.set(tb.x, 1.02, tb.z); scene.add(candle);
  const pl = new T.PointLight(0xffa96b, .5, 6); pl.position.set(tb.x, 1.6, tb.z); scene.add(pl);
  for (let s = 0; s < 4; s++) { const p = NC.seatPos(tb.id, s); const st = new T.Mesh(new T.CylinderGeometry(.5, .5, .5, 16), std(0x7a1b3f, { roughness: .5 })); st.position.set(p.x, .25, p.z); scene.add(st); }
  const tag = new T.Sprite(new T.SpriteMaterial({ map: textTex('T' + (tb.id + 1), 128, 64, '800 44px Arial', '#ffffff', '#ff3d9a'), transparent: true, depthWrite: false })); tag.scale.set(1.2, .6, 1); tag.position.set(tb.x, 2.0, tb.z); scene.add(tag);
  OBST_CIRCLES.push([tb.x, tb.z, 2.55]);
});
function collide(p, r, ignoreTable) {
  for (const [x0, z0, x1, z1] of OBST_RECTS) {
    const cx = Math.max(x0, Math.min(p.x, x1)), cz = Math.max(z0, Math.min(p.z, z1)); const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 < r * r) { if (d2 > 1e-6) { const d = Math.sqrt(d2); p.x = cx + dx / d * r; p.z = cz + dz / d * r; } else p.x = x0 - r; }
  }
  for (const [x, z, rad] of OBST_CIRCLES) {
    const dx = p.x - x, dz = p.z - z, d = Math.hypot(dx, dz), R = rad + r - .4; if (d < R && d > 1e-6) { p.x = x + dx / d * R; p.z = z + dz / d * R; }
  }
  p.x = Math.max(-ROOM.x + .8, Math.min(ROOM.x - .8, p.x)); p.z = Math.max(-ROOM.z + .8, Math.min(ROOM.z - .8, p.z));
}

/* ───────── 아바타 ───────── */
function makeLabel(text, color) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 80; const g = c.getContext('2d');
  g.fillStyle = 'rgba(15,6,34,.78)'; g.strokeStyle = color || '#ff3d9a'; g.lineWidth = 3;

    const opts = pool.map(c => ({ t: c.t, run: () => {
      const liked = c.like.includes(n.trait), d = liked ? 12 : (Math.random() < .5 ? 2 : -7); aff = Math.max(0, Math.min(100, aff + d)); turns++; n.talking = true; setTimeout(() => n.talking = false, 1600);
      render(liked ? c.r[Math.random() * 2 | 0] : (d < 0 ? '음… 그건 좀 별로네요. 다른 얘기 해요.' : '아, 그렇군요~ (끄덕)')); } }));
    opts.push({ t: '🥂 건배!', run: () => { aff = Math.min(100, aff + 8); n.talking = true; setTimeout(() => n.talking = false, 1200); render('건배! 쨍~ 🥂 분위기 좋은데요?'); } });
    opts.push({ t: '🍹 음료 주문하기', run: () => { aff = Math.min(100, aff + 5); render('와, 센스 있게 시켜 주셨네요. 감사해요!'); } });
    opts.push({ t: '👋 자리 정리하고 나가기', run: () => finish('자리를 정리했어요. 또 오세요!') });
    showDlg({ name: n.name, tag: n.tag, job: n.job, say, meter: aff, opts });
  };
  render('자, 앉았네요. 무슨 얘기부터 할까요?');
}
NC.requestSit = t => { if (P.busy) return; const free = NC.tableOcc[t].findIndex(v => v == null); if (free >= 0) { fade(() => NC.sitLocal(t, free)); } };
NC.requestStand = () => { if (!P.seat) return; const { t, s } = P.seat; NC.tableOcc[t][s] = null; NC.unseatAvatar(P.group); P.x = P.group.position.x; P.z = P.group.position.z; P.seat = null; P.busy = false; };

/* ───────── 상호작용 후보 ───────── */
let curAct = null; const actBtn = $('#act');
function computeAct() {
  if (!P.group || P.busy) return null; const c = [];
  if (P.seat) c.push({ label: '🚪 자리에서 일어나기 (E)', dist: 0, run: NC.requestStand });
  else {
    npcs.forEach(n => { if (n.enabled && n.state === 'wander') { const d = Math.hypot(n.x - P.x, n.z - P.z); if (d < 3) c.push({ label: `💬 ${n.name}에게 부킹 말 걸기 (E)`, dist: d, run: () => NC.startBooking(n) }); } });
    TABLES.forEach(t => { const d = Math.hypot(t.x - P.x, t.z - P.z); if (d < 3.7 && NC.tableOcc[t.id].some(v => v == null)) c.push({ label: `🪑 T${t.id + 1} 테이블에 앉기 (E)`, dist: d + .5, run: () => NC.requestSit(t.id) }); });
    NC.interactProviders.forEach(f => { try { (f() || []).forEach(x => c.push(x)); } catch (e) { } });
  }
  c.sort((a, b) => a.dist - b.dist); return c[0] || null;
}

/* ───────── 데이터 로딩 (public/data/*.json) ───────── */
const getJSON = async url => { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); };
NC.dataReady = (async () => {
  const [nd, dd] = await Promise.all([getJSON('data/npcs.json'), getJSON('data/dialogs.json')]);
  OPEN = dd.open || []; R1 = dd.reaction1 || {}; TOPIC = dd.topics || []; R2 = dd.reaction2 || {}; CHATS = dd.chats || []; BOOK = Object.assign(BOOK, dd.booking || {});
  (nd.npcs || []).forEach((d, i) => NC.addNpc(d, i));
  console.info(`[data] 손님 ${npcs.length}명, 대화 ${OPEN.length}/${TOPIC.length}/${CHATS.length} 로드`);
})();
NC.dataReady.catch(e => { console.error(e); $('#err').textContent = '데이터 파일(data/*.json)을 읽지 못했습니다. 파일을 더블클릭이 아니라 서버(npm start)로 여세요.'; $('#go').disabled = true; });

/* ───────── 시작 ───────── */
const COLORS = [0xff3d9a, 0x3de6ff, 0xffd23d, 0x9b5cff, 0x4cd964, 0xff8a3d];
let chosen = COLORS[0];
COLORS.forEach((c, i) => { const s = document.createElement('div'); s.className = 'sw' + (i ? '' : ' on'); s.style.background = '#' + c.toString(16).padStart(6, '0'); s.onclick = () => { chosen = c; document.querySelectorAll('.sw').forEach(x => x.classList.remove('on')); s.classList.add('on'); }; $('#sws').appendChild(s); });
try { $('#nick').value = localStorage.getItem('nc_nick') || ''; } catch (e) { }
let started = false;
NC.begin = function () {
  const name = NC.settings.name; P.group = makeAvatar(NC.settings.color, name + ' (나)'); P.group.position.set(P.x, 0, P.z); scene.add(P.group); started = true;
  $('#start').style.display = 'none'; try { Music.init(); } catch (e) { } NC.emit('start');
  NC.ui.toast('입장했어요! 🪩 NPC 근처에서 E 키(또는 버튼)로 부킹 말 걸기'); };
$('#go').onclick = async () => {
  const nm = $('#nick').value.trim(); $('#err').textContent = '';
  if (!/^[가-힣a-zA-Z0-9_ ]{2,10}$/.test(nm)) { $('#err').textContent = '닉네임은 2~10자(한글·영문·숫자)로 입력해 주세요.'; return; }
  NC.settings.name = nm; NC.settings.color = chosen; try { localStorage.setItem('nc_nick', nm); } catch (e) { }
  $('#go').disabled = true;
  try { await NC.dataReady; } catch (e) { return; }
  try { for (const h of NC.hooks.beforeStart) await h(); } catch (e) { $('#err').textContent = e.message || String(e); $('#go').disabled = false; return; }
  NC.begin(); $('#go').disabled = false;
};
$('#nick').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
actBtn.onclick = () => curAct && curAct.run();

/* ───────── 메인 루프 ───────── */
const clock = new T.Clock(); let tAcc = 0;
function frame() {
  requestAnimationFrame(frame); const dt = Math.min(clock.getDelta(), .05); tAcc += dt; const t = tAcc;
  // 조명 · 타일
  ball.rotation.y += dt * .6;
  spots.forEach(s => { const a = t * .6 + s.k * 1.6; s.tg.position.set(Math.cos(a) * 6, 0, 2 + Math.sin(a * 1.3) * 6); s.beam.lookAt(s.tg.position); s.L.intensity = 1.5 + Math.sin(t * 3 + s.k) * .5; });
  floorGlow[0].intensity = 1 + Math.sin(t * 4) * .5; floorGlow[1].intensity = 1 + Math.cos(t * 4) * .5;
  const beat = (t * 118 / 60) % 1;
  tiles.forEach(m => { const { i, j } = m.userData; const h = (t * .12 + (i + j) * .05) % 1; m.material.emissive.setHSL(h, 1, .5); m.material.emissiveIntensity = .35 + .55 * Math.max(0, Math.sin(t * 2 + (i * 2 + j * 3) * .6)) + (1 - beat) * .15; });
  npcs.forEach(n => { if (n.enabled) { updateNPC(n, dt); animAvatar(n.g, dt); } });
  if (NC.dj) animAvatar(NC.dj, dt);
  if (P.group) {
    let kx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0), ky = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0);
    kx += joy.x; ky += joy.y; const kl = Math.hypot(kx, ky);
    if (kl > .1 && !P.busy) { if (P.seat) NC.requestStand(); P.target = null; }
    if (!P.busy && !P.seat) {
      let mx = 0, mz = 0, moving = false;
      if (kl > .1) { const l = Math.min(1, kl); const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw); mx = (kx / kl) * cy + (ky / kl) * -sy; mz = (kx / kl) * -sy + (ky / kl) * -cy; mx *= l; mz *= l; moving = true; }
      else if (P.target) { const dx = P.target.x - P.x, dz = P.target.z - P.z, d = Math.hypot(dx, dz); if (d < .25) P.target = null; else { mx = dx / d; mz = dz / d; moving = true; } }
      if (moving) { const px = P.x, pz = P.z; P.x += mx * P.speed * dt; P.z += mz * P.speed * dt; collide(P, .4); if (P.target && Math.hypot(P.x - px, P.z - pz) < P.speed * dt * .2) P.target = null; P.ry = lerpAngle(P.ry, Math.atan2(mx, mz), Math.min(1, dt * 12)); P.group.rotation.y = P.ry; }
      P.group.position.set(P.x, 0, P.z); P.group.userData.moving = moving;
    } else if (P.busy && P.seat == null && dlgState == null) { P.group.userData.moving = false; }
    P.group.userData.talk = !!(P.seat && dlg.style.display === 'block');
    animAvatar(P.group, dt);
    // 카메라
    const tx = P.group.position.x, tz = P.group.position.z, ty = 1.4;
    const cx = tx + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist, cz = tz + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist, cyy = ty + Math.sin(cam.pitch) * cam.dist;
    camera.position.lerp(new T.Vector3(cx, cyy, cz), Math.min(1, dt * 6)); camera.lookAt(tx, ty, tz);
    // 상호작용 버튼
    curAct = computeAct(); if (curAct) { actBtn.style.display = 'block'; if (actBtn.textContent !== curAct.label) actBtn.textContent = curAct.label; } else actBtn.style.display = 'none';
  } else { const a = t * .15; camera.position.set(Math.sin(a) * 16, 8, 10 + Math.cos(a) * 6); camera.lookAt(0, 2, 0); }
  NC.tickers.forEach(f => { try { f(dt, t); } catch (e) { console.error(e); } });
  renderer.render(scene, camera);
}
frame();

/* ───────── 서버 감지 (있으면 멀티플레이·운영 모듈 로드) ───────── */
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.body.appendChild(s); });
(async () => {
  const qs = new URLSearchParams(location.search);
  if (qs.get('mode') === 'demo' || !/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch('/api/health', { cache: 'no-store' }); if (!r.ok) return; const h = await r.json(); if (!h || !h.ok) return;
    await loadScript('ops.js'); await loadScript('multi.js'); $('#badge').textContent = 'ONLINE';
  } catch (e) { /* 서버 없음 → 데모 모드 유지 */ }
})();
})();
</script>
